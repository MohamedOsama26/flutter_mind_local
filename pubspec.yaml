name: flutter_mind_local
description: "On-device AI inference for Flutter using llama.cpp via FFI. Local engine companion to flutter_mind."
version: 0.1.0

topics:
  - ai
  - llm
  - ffi
  - on-device-ai
  - llama

environment:
  sdk: ^3.12.1
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_mind:
    path: ../flutter_mind
  ffi: ^2.1.4
  meta: ^1.16.0

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true