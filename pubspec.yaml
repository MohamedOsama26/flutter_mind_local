name: flutter_mind_local
description: "On-device LLM inference via llama.cpp. Drop LocalEngine into flutter_mind's FlutterMindClient — same API as every other engine."
version: 0.1.0
repository: https://github.com/MohamedOsama26/flutter_mind_local
homepage: https://github.com/MohamedOsama26/flutter_mind_local

topics:
  - ai
  - llm
  - ffi
  - on-device-ai
  - llama

environment:
  sdk: ^3.12.1
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_mind: ^0.3.0
  ffi: ^2.1.4
  meta: ^1.16.0

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      # iOS build files exist (package.swift) but are untested on a real
      # device/simulator — left out of platform support until verified.
      # See package.swift if you want to test and report back.